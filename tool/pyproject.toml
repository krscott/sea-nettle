[project]
name = "sea_nettle"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sea-nettle = "sea_nettle.__main__:run"

[build-system]
requires = ["setuptools >= 61.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sea_nettle"]

[tool.setuptools.package-data]
"sea_nettle" = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
skip = [".direnv", "result", ".venv"]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
exclude = [".direnv", "result", ".venv"]

[tool.mypy]
strict = true
exclude = [".direnv", "result", ".venv"]
pretty = true
show_column_numbers = true
show_error_context = true
