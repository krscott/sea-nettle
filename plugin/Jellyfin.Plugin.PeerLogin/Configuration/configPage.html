<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Peer Login</title>
</head>
<body>
    <div id="PeerLoginConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <form id="PeerLoginConfigForm">
                    <div class="inputContainer">
                        <input is="emby-input" type="url" id="SourceUrl" required label="Source server URL" />
                        <div class="fieldDescription">
                            Base URL of the source Jellyfin server, such as https://source.example.net:8920.
                            The plugin refuses all sign-ins unless the URL uses HTTPS or a loopback address.
                        </div>
                    </div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                const pluginId = '74c2e693-6ab7-40fa-858d-c752d48cb45c';
                const page = document.querySelector('#PeerLoginConfigPage');

                page.addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        page.querySelector('#SourceUrl').value = config.SourceUrl || '';
                        Dashboard.hideLoadingMsg();
                    });
                });

                page.querySelector('#PeerLoginConfigForm').addEventListener('submit', function (event) {
                    event.preventDefault();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        config.SourceUrl = page.querySelector('#SourceUrl').value.trim();
                        return ApiClient.updatePluginConfiguration(pluginId, config);
                    }).then(Dashboard.processPluginConfigurationUpdateResult);
                    return false;
                });
            })();
        </script>
    </div>
</body>
</html>
